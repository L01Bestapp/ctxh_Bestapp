spring.application.name=uni_volunteer

# Cấu hình Server Port (mặc định là 8080)
server.port=8080

# Cấu hình PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/(ten_database_cua_ban)
spring.datasource.username=(username_postgresql)
spring.datasource.password=(password_postgresql)

# Cấu hình JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update  # Tự động cập nhật schema (tuyệt vời cho dev)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true # Hiển thị câu lệnh SQL trong console